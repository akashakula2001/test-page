<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact | Sample Site</title>
  <link rel="stylesheet" href="contact.css">
</head>
<body>
  <main class="contact-page">
    <h1>Contact us</h1>
    <p>For general inquiries, please contact our team.</p>
    <p>Email: <a href="mailto:hello@example.com">hello@example.com</a></p>

    <section class="office-hours" itemscope itemtype="https://schema.org/OpeningHoursSpecification">
      <h2 class="office-hours__title">Office Hours</h2>
      <dl class="office-hours__schedule">
        <dt>Monday – Friday</dt>
        <dd>
          <time itemprop="opens" content="09:00:00">9:00 AM</time> – <time itemprop="closes" content="17:00:00">5:00 PM</time>
          <meta itemprop="dayOfWeek" content="https://schema.org/Monday">
          <meta itemprop="dayOfWeek" content="https://schema.org/Tuesday">
          <meta itemprop="dayOfWeek" content="https://schema.org/Wednesday">
          <meta itemprop="dayOfWeek" content="https://schema.org/Thursday">
          <meta itemprop="dayOfWeek" content="https://schema.org/Friday">
        </dd>
      </dl>
    </section>
  </main>
</body>
</html>
